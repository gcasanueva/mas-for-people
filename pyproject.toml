[project]
name = "mas-for-people"
version = "0.1.0"
description = "Salas de agentes especializados que debaten por turnos (MVP vía MCP en Claude Desktop)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.scripts]
mas-validar = "mas.validar:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
