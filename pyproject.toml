[project]
name = "mas-for-people"
version = "0.4.0"
description = "Salas de agentes especializados que debaten por turnos (MVP vía MCP en Claude Desktop, con visor de escritorio)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "PySide6-Essentials>=6.7",
]

[project.scripts]
mas-validar = "mas.validar:main"
mas-servidor = "mas.servidor.app:main"
mas-config = "mas.servidor.config:main"
mas-visor = "mas.visor.app:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
